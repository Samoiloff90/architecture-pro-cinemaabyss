name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cinema
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
      - cinema
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========== MONOLITH ==========
      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== MOVIES SERVICE ==========
      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== PROXY SERVICE ==========
      - name: Extract metadata (tags, labels) for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== EVENTS SERVICE ==========
      - name: Extract metadata (tags, labels) for Events Service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== API TESTS ==========
  api-tests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create docker-compose for tests
        run: |
          cat > docker-compose.ci.yml << 'EOF'
          version: '3.8'

          services:
            postgres:
              image: postgres:14
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres_password
                POSTGRES_DB: cinemaabyss
              ports:
                - "5432:5432"
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 5s
                timeout: 5s
                retries: 10

            zookeeper:
              image: wurstmeister/zookeeper:latest
              ports:
                - "2181:2181"

            kafka:
              image: wurstmeister/kafka:2.13-2.7.0
              depends_on:
                - zookeeper
              environment:
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
                KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
                KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
                KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
              ports:
                - "9092:9092"

            monolith:
              image: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:${{ github.ref_name }}
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                PORT: 8080
                DB_CONNECTION_STRING: "postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable"
              ports:
                - "8080:8080"

            movies-service:
              image: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
              depends_on:
                postgres:
                  condition: service_healthy
              environment:
                PORT: 8081
                DB_CONNECTION_STRING: "postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable"
              ports:
                - "8081:8081"

            events-service:
              image: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
              depends_on:
                - kafka
              environment:
                PORT: 8082
                KAFKA_BROKERS: "kafka:9092"
              ports:
                - "8082:8082"

            proxy-service:
              image: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
              depends_on:
                - monolith
                - movies-service
                - events-service
              environment:
                PORT: 8000
                MONOLITH_URL: "http://monolith:8080"
                MOVIES_SERVICE_URL: "http://movies-service:8081"
                EVENTS_SERVICE_URL: "http://events-service:8082"
                GRADUAL_MIGRATION: "true"
                MOVIES_MIGRATION_PERCENT: "50"
              ports:
                - "8000:8000"
          EOF

      - name: Pull Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Start services
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to start..."
          sleep 45

      - name: Initialize database
        run: |
          docker-compose -f docker-compose.ci.yml exec -T postgres psql -U postgres -d cinemaabyss < ./src/database/init.sql || true

      - name: Check service health
        run: |
          echo "=== Container Status ==="
          docker-compose -f docker-compose.ci.yml ps

          echo "=== Testing Health Endpoints ==="
          curl -f http://localhost:8080/health || echo "Monolith health check failed"
          curl -f http://localhost:8081/api/movies/health || echo "Movies health check failed"
          curl -f http://localhost:8082/health || echo "Events health check failed"
          curl -f http://localhost:8000/health || echo "Proxy health check failed"

          echo "=== Service Logs ==="
          docker-compose -f docker-compose.ci.yml logs --tail=50

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Postman tests
        working-directory: ./tests/postman
        run: |
          npm install
          npm run test:local || echo "Some tests failed but continuing..."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: tests/postman/newman/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml down -v