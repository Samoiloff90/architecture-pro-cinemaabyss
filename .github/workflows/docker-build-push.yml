name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cinema
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  pull_request:
    branches:
      - main
      - cinema
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  MONOLITH_IMAGE_NAME: ${{ github.repository }}/monolith
  MOVIES_SERVICE_IMAGE_NAME: ${{ github.repository }}/movies-service
  EVENTS_SERVICE_IMAGE_NAME: ${{ github.repository }}/events-service
  PROXY_SERVICE_IMAGE_NAME: ${{ github.repository }}/proxy-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ========== MONOLITH ==========
      - name: Extract metadata (tags, labels) for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Monolith Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== MOVIES SERVICE ==========
      - name: Extract metadata (tags, labels) for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Movies Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== PROXY SERVICE ==========
      - name: Extract metadata (tags, labels) for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Proxy Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ========== EVENTS SERVICE ==========
      - name: Extract metadata (tags, labels) for Events Service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Events Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== API TESTS ==========
  api-tests:
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: cinemaabyss
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      zookeeper:
        image: wurstmeister/zookeeper:latest
        ports:
          - 2181:2181

      kafka:
        image: wurstmeister/kafka:2.13-2.7.0
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_CREATE_TOPICS: "movie-events:1:1,user-events:1:1,payment-events:1:1"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        ports:
          - 9092:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}
          docker pull ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Initialize database
        run: |
          PGPASSWORD=postgres_password psql -h localhost -U postgres -d cinemaabyss -f ./src/database/init.sql || true

      - name: Run Monolith
        run: |
          docker run -d --name monolith \
            --network host \
            -e PORT=8080 \
            -e DB_CONNECTION_STRING="postgres://postgres:postgres_password@localhost:5432/cinemaabyss?sslmode=disable" \
            ${{ env.REGISTRY }}/${{ env.MONOLITH_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Run Movies Service
        run: |
          docker run -d --name movies-service \
            --network host \
            -e PORT=8081 \
            -e DB_CONNECTION_STRING="postgres://postgres:postgres_password@localhost:5432/cinemaabyss?sslmode=disable" \
            ${{ env.REGISTRY }}/${{ env.MOVIES_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Run Events Service
        run: |
          docker run -d --name events-service \
            --network host \
            -e PORT=8082 \
            -e KAFKA_BROKERS="localhost:9092" \
            ${{ env.REGISTRY }}/${{ env.EVENTS_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Run Proxy Service
        run: |
          docker run -d --name proxy-service \
            --network host \
            -e PORT=8000 \
            -e MONOLITH_URL="http://localhost:8080" \
            -e MOVIES_SERVICE_URL="http://localhost:8081" \
            -e EVENTS_SERVICE_URL="http://localhost:8082" \
            -e GRADUAL_MIGRATION="true" \
            -e MOVIES_MIGRATION_PERCENT="50" \
            ${{ env.REGISTRY }}/${{ env.PROXY_SERVICE_IMAGE_NAME }}:${{ github.ref_name }}

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30
          
          echo "=== Container Status ==="
          docker ps -a
          
          echo "=== Monolith Logs ==="
          docker logs monolith
          
          echo "=== Movies Service Logs ==="
          docker logs movies-service
          
          echo "=== Events Service Logs ==="
          docker logs events-service
          
          echo "=== Proxy Service Logs ==="
          docker logs proxy-service

      - name: Test service endpoints
        run: |
          echo "Testing Monolith health..."
          curl -f http://localhost:8080/health || echo "Monolith health check failed"
          
          echo "Testing Movies Service health..."
          curl -f http://localhost:8081/api/movies/health || echo "Movies health check failed"
          
          echo "Testing Events Service health..."
          curl -f http://localhost:8082/health || echo "Events health check failed"
          
          echo "Testing Proxy Service health..."
          curl -f http://localhost:8000/health || echo "Proxy health check failed"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and run Postman tests
        working-directory: ./tests/postman
        run: |
          npm install
          npm run test:local || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: tests/postman/newman/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker stop monolith movies-service events-service proxy-service || true
          docker rm monolith movies-service events-service proxy-service || true