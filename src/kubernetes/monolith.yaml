apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: cinemaabyss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      imagePullSecrets:
      - name: dockerconfigjson
      containers:
      - name: monolith
        image: ghcr.io/samoiloff90/architecture-pro-cinemaabyss/monolith:cinema
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DB_CONNECTION_STRING
          valueFrom:
            configMapKeyRef:
              name: cinemaabyss-config
              key: DB_CONNECTION_STRING

---
apiVersion: v1
kind: Service
metadata:
  name: monolith
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: monolith
  ports:
  - port: 8080
    targetPort: 8080