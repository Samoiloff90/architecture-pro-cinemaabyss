apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: cinemaabyss.example.com
    http:
      paths:
      # Proxy Service (API Gateway)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proxy-service
            port:
              number: 8000

      # Events Service (direct access for testing)
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: events-service
            port:
              number: 8082