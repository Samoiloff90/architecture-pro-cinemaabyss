apiVersion: v1
kind: ConfigMap
metadata:
  name: cinemaabyss-config
  namespace: cinemaabyss
data:
  # Database configuration
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "cinemaabyss"
  DB_USER: "postgres"
  DB_CONNECTION_STRING: "postgres://postgres:postgres_password@postgres:5432/cinemaabyss?sslmode=disable"

  # Kafka configuration
  KAFKA_BROKERS: "kafka:9092"
  ZOOKEEPER_CONNECT: "zookeeper:2181"

  # Service URLs
  MONOLITH_URL: "http://monolith:8080"
  MOVIES_SERVICE_URL: "http://movies-service:8081"
  EVENTS_SERVICE_URL: "http://events-service:8082"

  # Strangler Fig configuration
  GRADUAL_MIGRATION: "true"
  MOVIES_MIGRATION_PERCENT: "50"

  # Service Ports
  MONOLITH_PORT: "8080"
  MOVIES_SERVICE_PORT: "8081"
  EVENTS_SERVICE_PORT: "8082"
  PROXY_SERVICE_PORT: "8000"