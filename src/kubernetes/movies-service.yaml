apiVersion: apps/v1
kind: Deployment
metadata:
  name: movies-service
  namespace: cinemaabyss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: movies-service
  template:
    metadata:
      labels:
        app: movies-service
    spec:
      imagePullSecrets:
      - name: dockerconfigjson
      containers:
      - name: movies-service
        image: ghcr.io/samoiloff90/architecture-pro-cinemaabyss/movies-service:cinema
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_CONNECTION_STRING
          valueFrom:
            configMapKeyRef:
              name: cinemaabyss-config
              key: DB_CONNECTION_STRING

---
apiVersion: v1
kind: Service
metadata:
  name: movies-service
  namespace: cinemaabyss
spec:
  type: ClusterIP
  selector:
    app: movies-service
  ports:
  - port: 8081
    targetPort: 8081